<div class="card">
  <div class="card-body">
    <h3>{{isInEditMode ? 'Update employee' : 'Add Employee'}}</h3>
    <div class="form-group">
      <label for="empName">Employee Name</label>
      <input type="text" #empName class="form-control" />
    </div>
    <div class="form-group">
      <label for="empAddress">Employee Address</label>
      <input type="text" #empAddress class="form-control" />
    </div>
    <div class="form-group">
      <label for="empContact">Employee conatct</label>
      <input type="text" #empContact class="form-control" />
    </div>
    <div class="form-group">
      <label for="isInService">Is In Service</label>
      <select #isInService class="form-control">
        <option [value]="true">Yes</option>
        <option [value]="false">No</option>
      </select>
    </div>
    <button class="btn btn-primary btn-block" *ngIf="!isInEditMode" (click)="onEmployeeAdd()">Add employee</button>
    <button class="btn btn-danger btn-block" *ngIf="isInEditMode" (click)="onEmployeeUpdate()">Update employee</button>
  </div>
</div>
