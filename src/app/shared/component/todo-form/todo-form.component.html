<div class="card">
  <div class="card-body">
    <div class="form-group">
      <label for="todoItem">Todo Item</label>
      <input type="text" #todoItem class="form-control" />
    </div>
    <div class="form-group">
      <label for="isCompleted">isCompleted</label>
      <select #isCompleted class="form-control">
        <option [value]="true">Yes</option>
        <option [value]="false">No</option>
      </select>
    </div>
    <button
      mat-flat-button
      color="primary"
      (click)="onTodoAdd()"
      class="btn btn-block"
    >
      Add Todo
    </button>
  </div>
</div>
