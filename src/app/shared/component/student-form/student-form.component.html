<div class="card">
  <div class="card-body">
    <h2>{{isInEditMode?'Update Student':'Add Student'}}</h2>
    <div class="form-group">
      <label for="fname">First Name</label>
      <input type="text" #fname class="form-control" />
    </div>
    <div class="form-group">
      <label for="lname">Last Name</label>
      <input type="text" #lname class="form-control" />
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="text" #email class="form-control" />
    </div>
    <div class="form-group">
      <label for="contact">Contact</label>
      <input type="text" #contact class="form-control" />
    </div>
    <div class="form-group">
      <label for="contact">Is Active</label>
      <select #isActive id="isActive" class="form-control">
        <option value="true">Yes</option>
        <option value="false">No</option>
      </select>
    </div>
    <button *ngIf="!isInEditMode" class="btn btn-primary btn-block" (click)="onStudentAdd()">Add Student</button>
    <button *ngIf="isInEditMode" class="btn btn-warning btn-block"(click)="onStudentUpdate()">Update Student</button>
  </div>
</div>
